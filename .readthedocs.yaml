# Read the Docs configuration file.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

# The package itself is NOT installed: its `full` extra requires ps_1loop_jax,
# which is a local sibling checkout, not a PyPI distribution. Autodoc reads the
# sources from ../src (see conf.py) and mocks the unavailable imports.
python:
  install:
    - requirements: docs/requirements.txt
